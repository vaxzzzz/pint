<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MáquinasMax</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

    <header>
        <a href="../../index.html" class="logo">MáquinasMax</a>
        <div style="flex: 1;"></div>
    </header>

    <main style="min-height: calc(100vh - 100px); display: flex; justify-content: center; align-items: center;">
        <div class="card-center">
            <div style="text-align: center; margin-bottom: 30px;">
                <div style="width: 80px; height: 80px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 35px; margin: 0 auto 20px; box-shadow: 0 4px 15px rgba(247, 147, 30, 0.3);">👤</div>
                <h2>Bem-vindo</h2>
                <p style="color: #888; margin-top: 10px;">Entre com sua conta para continuar</p>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" id="loginEmail" placeholder="Digite seu e-mail" required>
                </div>

                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" id="loginSenha" placeholder="Digite sua senha" required>
                </div>

                <button type="submit" class="btn-laranja">Entrar</button>
            </form>

            <div style="margin-top: 25px; text-align: center;">
                <a href="cadastro.html" style="font-size: 14px; color: #888; text-decoration: none; transition: 0.2s; display: block; margin-bottom: 10px;">Não possui conta? Faça o cadastro!</a>
                <a href="esqueci-senha.html" style="font-size: 14px; color: #888; text-decoration: none; transition: 0.2s;">Esqueceu sua senha?</a>
            </div>
        </div>
    </main>

    <footer style="position: fixed; bottom: 0; width: 100%; background: white; padding: 15px; text-align: center; border-top: 1px solid #ddd; font-size: 12px;">
        <a href="../../index.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">← Voltar</a>
    </footer>

    <script src="../../js/main.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const senha = document.getElementById('loginSenha').value;

            if (!validarEmail(email)) {
                alert('E-mail inválido!');
                return;
            }

            if (!validarSenha(senha)) {
                alert('Senha deve ter no mínimo 6 caracteres!');
                return;
            }

            alert('Login realizado com sucesso! (Função integrada com backend pendente)');
            // window.location.href = '../../index.html';
        });
    </script>
</body>
</html>
